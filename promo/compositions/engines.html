  <script>
    const tl = gsap.timeline({ paused: true });
    const STEP = 180;

    tl.fromTo(
      "#eng-title span",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 },
      0.05,
    );
    tl.fromTo("#eng-band", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 0.35);
    // Slot machine: each engine name rolls in from below.
    tl.fromTo(
      "#eng-list",
      { y: STEP, filter: "blur(8px)" },
      { y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" },
      0.45,
    );
    // One roll every 0.44 s (written out so `hyperframes lint` can read the times).
    const roll = (i) => [
      "#eng-list",
      { y: -STEP * (i - 1), filter: "blur(6px)" },
      { y: -STEP * i, filter: "blur(0px)", duration: 0.2, ease: "power3.out", immediateRender: false },
    ];
    tl.fromTo(...roll(1), 0.89);
    tl.fromTo(...roll(2), 1.33);
    tl.fromTo(...roll(3), 1.77);
    tl.fromTo(...roll(4), 2.21);
    tl.fromTo("#eng-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0.8);

    // Iris: the brand blue floods out from the engine name into the next scene.

      "#eng-iris",
      { clipPath: "circle(0% at 50% 56%)" },
      { clipPath: "circle(80% at 50% 56%)", duration: 0.38, ease: "power3.in" },
      3.2,
    );

    window.__timelines["engines"] = tl;
