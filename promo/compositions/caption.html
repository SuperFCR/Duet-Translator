<template>
  <!--
    Caption over a footage beat. Mounted once per beat by index.html (generated by scripts/timeline.mjs),
    which passes title / sub / dur through data-variable-values. Wrap words in *asterisks* for the blue accent.
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      container-type: size;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: var(--ink);
    }
    .cap-stack {
      position: absolute;
      left: 260px;
      right: 260px;
      top: 30px;
      height: 158px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      text-align: left;
    }
    .cap-title {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }
    .cap-title span {
      display: inline-block;
    }
    .cap-title .cap-accent {
      color: var(--blue-800);
    }
    .cap-sub {
      margin-top: 8px;
      font-size: 32px;
      line-height: 1.3;
      color: var(--slate);
      text-wrap: balance;
    }
    @container (max-aspect-ratio: 5/4) {
      .cap-stack {
        left: 50px;
        right: 50px;
        top: 30px;
        height: 278px;
        align-items: center;
        text-align: center;
      }
      .cap-title {
        font-size: 64px;
        text-wrap: balance;
      }
      .cap-sub {
        font-size: 30px;
      }
    }
  </style>
  <div
    id="root"
    data-composition-id="caption"
    data-composition-variables='[
      {"id":"title","type":"string","label":"Title (*accent*)","default":"Caption *title*"},
      {"id":"sub","type":"string","label":"Sub-line","default":""},
      {"id":"dur","type":"number","label":"Slot length (s)","default":4}
    ]'
  >
    <div class="cap-stack">
      <div class="cap-title"></div>
      <div class="cap-sub"></div>
    </div>
  </div>
  <script>
    const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    const title = String(vars.title || "");
    const sub = String(vars.sub || "");
    const dur = Number(vars.dur) || 4;
    const titleEl = document.querySelector(".cap-title");
    const subEl = document.querySelector(".cap-sub");

    // "Paragraph-aligned *sync scrolling*" -> one span per word, accent words marked.
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    titleEl.innerHTML = title
      .split("*")
      .map((part, i) =>
        part
          .split(/\s+/)
          .filter(Boolean)
          .map((w) => '<span class="' + (i % 2 ? "cap-accent" : "") + '">' + esc(w) + "</span>")
          .join(" "),
      )
      .filter(Boolean)
      .join(" ");
    subEl.textContent = sub;
    if (!sub) subEl.style.display = "none";

    const tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".cap-title span",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 },
      0.2,
    );
    tl.fromTo(".cap-sub", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.5);
    tl.to(".cap-stack", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, Math.max(0.8, dur - 0.24));

    window.__timelines["caption"] = tl;
  </script>
</template>
