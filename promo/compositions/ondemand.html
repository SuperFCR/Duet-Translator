        <div class="od-sub">Only where you stop. Nothing is sent mid-scroll.</div>
      </div>
      <div class="od-text" id="od-text-b">
        <div class="od-title"><span>Revisits</span> <span>are</span></div>
        <div class="od-title od-accent"><span>instant</span></div>
        <div class="od-sub">Straight from local cache.</div>

  <script>
    // A minimap of the page (left) and its translation pane (right). Only the paragraphs around
    // the screen the reader stops on get translated; the ones flown past stay untranslated.
    const LINES = [3, 2, 4, 3, 2, 3, 4, 2, 3, 3, 2, 3];
    const WIDTHS = [84, 76, 90, 70, 80, 88, 74];
    const LINE = 20;
    const BAR = 10;
    const GAP = 26;
    const PAD = 26;
    const tops = [];
    const right = [];

    function build(pageSel, collect) {
      const page = document.querySelector(pageSel);
      let y = PAD;
      LINES.forEach((n, i) => {
        if (collect) tops.push(y);
        const group = [];
        for (let j = 0; j < n; j++) {
          const bar = document.createElement("div");
          bar.className = "od-bar";
          const w = WIDTHS[(i * 3 + j * 2) % WIDTHS.length];
          bar.style.top = y + "px";
          bar.style.width = (j === n - 1 && n > 1 ? Math.round(w * 0.6) : w) * 2.02 + "px";
          page.appendChild(bar);
          group.push(bar);
          y += LINE;
        }
        y += GAP - (LINE - BAR);
        if (!collect) right.push(group);
      });
    }
    build("#od-page-l", true);
    build("#od-page-r", false);

    const frameAt = (i) => tops[i] - 22;
    const STOP_A = 0;
    const STOP_B = 7;

    const tl = gsap.timeline({ paused: true });
    gsap.set("#od-frame", { y: frameAt(STOP_A) });
    gsap.set("#od-skip-row", { y: (tops[4] + tops[7]) / 2 - 40 });
    gsap.set("#od-cache-row", { y: frameAt(STOP_A) + 256 });

    // Arrival: whip in from the right, matching the previous scene's exit.
    tl.fromTo(
      "#od-diagram-pos",
      { x: 260, opacity: 0, filter: "blur(14px)" },
      { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
      0,
    );
    tl.fromTo(
      "#od-text-a .od-title span",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 },
      0.2,
    );
    tl.fromTo("#od-text-a .od-sub", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.5);
    tl.set("#od-text-b .od-title span, #od-text-b .od-sub", { opacity: 0 }, 0);

    // Paragraphs pulse while in flight, then fill in (streaming), one after another.
    function translate(from, to, at) {
      for (let i = from; i <= to; i++) {
        const t = at + (i - from) * 0.16;
        tl.fromTo(right[i], { opacity: 1 }, { opacity: 0.35, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 1 }, t);
        tl.to(right[i], { backgroundColor: "#3b82f6", duration: 0.12, ease: "power1.out" }, t + 0.26);
      }
    }
    translate(0, 3, 0.5);

    // Fly down: everything in between is skipped.
    tl.to("#od-frame", { y: frameAt(STOP_B), duration: 0.42, ease: "power3.inOut" }, 1.35);
    tl.fromTo("#od-skip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.8);
    translate(7, 10, 1.95);

    // Swap the line on the same stage.
    tl.to("#od-text-a", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 3.0);
    tl.fromTo(
      "#od-text-b .od-title span",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 },
      3.12,
    );
    tl.fromTo("#od-text-b .od-sub", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 3.4);

    // Fly back up: already translated, served from cache.
    tl.to("#od-skip", { opacity: 0, duration: 0.15, ease: "power1.in" }, 3.1);
    tl.to("#od-frame", { y: frameAt(STOP_A), duration: 0.42, ease: "power3.inOut" }, 3.2);
    tl.fromTo("#od-cache", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 3.62);

    // Exit: blur swap.
    tl.to("#od-diagram-pos, #od-texts", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.32);

    window.__timelines["ondemand"] = tl;
  </script>
