  <script>
    const tl = gsap.timeline({ paused: true });

    // The blue ground of the cost beat shrinks into the logo tile.
    tl.fromTo("#outro-flood", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
    // Scale 11 still covers the whole frame (16:9 and square), so the move starts on the first frame.
    tl.fromTo("#outro-logo", { scale: 11 }, { scale: 1, duration: 0.75, ease: "power2.inOut" }, 0);
    tl.fromTo(
      "#outro-pages",
      { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" },
      0.55,
    );
    tl.fromTo("#outro-band", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power3.inOut" }, 0.72);

    tl.fromTo(
      "#outro-word",
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.out" },
      0.9,
    );
    tl.fromTo("#outro-oss", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.25);
    tl.fromTo("#outro-url", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 1.38);

    window.__timelines["outro"] = tl;
