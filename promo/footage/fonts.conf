<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Promo recording: e2e CJK fonts + Noto Serif / Noto CJK / Inter (extracted from Ubuntu debs into ~/.cache/duet-promo-fonts) -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.cache/st-e2e-libs/fontroot/usr/share/fonts</dir>
  <dir>~/.cache/duet-promo-fonts/fonts</dir>
  <cachedir>~/.cache/duet-promo-fonts/fontcache</cachedir>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Ubuntu Mono</family><family>Noto Sans Mono CJK SC</family></prefer></alias>
</fontconfig>
