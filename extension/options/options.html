<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Duet-Translator</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1 class="brand"><img src="../icons/logo.svg" width="34" height="34" alt=""><span data-i18n="opt.title"></span>
    <a class="welcome" href="../welcome/welcome.html" target="_blank" data-i18n="opt.welcome"></a></h1>

  <section>
    <h2 data-i18n="opt.general"></h2>
    <div class="grid">
      <label><span data-i18n="opt.uiLang"></span>
        <select id="uiLang">
          <option value="auto" data-i18n="ui.auto"></option><option value="zh">中文</option><option value="en">English</option>
        </select>
      </label>
      <label><span data-i18n="opt.source"></span> <select id="sourceLang"></select></label>
      <label><span data-i18n="opt.target"></span> <select id="targetLang"></select></label>
      <label><span data-i18n="opt.active"></span> <select id="activeProviderId"></select></label>
      <label><span data-i18n="opt.highlight"></span>
        <select id="highlight"><option value="hover" data-i18n="hl.hover"></option><option value="off" data-i18n="hl.off"></option></select>
      </label>
      <label data-i18n-title="opt.prefetch.title"><span data-i18n="opt.prefetch"></span> <input id="prefetchScreens" type="number" min="0" max="10" step="0.5"></label>
      <label class="chk"><input id="syncScroll" type="checkbox"> <span data-i18n="opt.sync"></span></label>
      <label class="chk" data-i18n-title="opt.strip.title"><input id="stripFrameHeaders" type="checkbox"> <span data-i18n="opt.strip"></span></label>
    </div>
  </section>

  <section>
    <h2 data-i18n="opt.engines"></h2>
    <p class="hint" data-i18n-html="opt.engines.hint"></p>
    <div id="providers"></div>
    <div class="row">
      <button id="addOpenai" data-i18n="opt.addOpenai"></button>
      <button id="addDeepl" data-i18n="opt.addDeepl"></button>
    </div>
  </section>

  <section>
    <h2 data-i18n="opt.dev"></h2>
    <label class="chk"><input id="devMode" type="checkbox"> <span data-i18n="opt.devMode"></span></label>
  </section>

  <section>
    <h2 data-i18n="opt.cache"></h2>
    <p class="hint" data-i18n="opt.cache.hint"></p>
    <div class="stats" id="cacheStats"></div>
    <div class="grid">
      <label data-i18n-title="opt.cacheMaxMB.title"><span data-i18n="opt.cacheMaxMB"></span> <input id="cacheMaxMB" type="number" min="1" max="2048" step="1"></label>
      <label data-i18n-title="opt.cacheTTL.title"><span data-i18n="opt.cacheTTL"></span> <input id="cacheTTLDays" type="number" min="1" max="3650" step="1"></label>
    </div>
    <div class="row">
      <button id="pruneCache" data-i18n="opt.pruneCache"></button>
      <button id="clearEngineCache" data-i18n="opt.clearEngineCache"></button>
      <button id="clearCache" class="danger" data-i18n="opt.clearCache"></button>
      <span id="cacheInfo" class="muted"></span>
    </div>
  </section>

  <section>
    <h2 data-i18n="opt.usage"></h2>
    <p class="hint" data-i18n="opt.usage.hint"></p>
    <div id="usageTable"></div>
    <div class="row"><button id="resetUsage" data-i18n="opt.resetUsage"></button></div>
  </section>

  <div class="savebar"><button id="save" class="primary" data-i18n="opt.save"></button><span id="saved"></span></div>
</main>
<template id="tpl-provider">
  <fieldset class="prov">
    <legend><span class="type"></span></legend>
    <div class="grid fields"></div>
    <div class="row">
      <button class="test" data-i18n="opt.test"></button>
      <button class="del danger" data-i18n="opt.del"></button>
      <pre class="out"></pre>
    </div>
  </fieldset>
</template>
<script src="../shared/defaults.js"></script>
<script src="../shared/i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
